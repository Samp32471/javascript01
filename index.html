<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Mastery Course - Interactive Learning</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6c63ff;
            --primary-dark: #5a52d5;
            --secondary: #ff6584;
            --success: #00d2d3;
            --warning: #feca57;
            --danger: #ff6b6b;
            --dark: #2d3436;
            --gray: #636e72;
            --light-gray: #dfe6e9;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--white);
        }

        .logo i {
            font-size: 2rem;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid transparent;
            color: var(--white);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: var(--white);
            color: var(--primary);
            border-color: var(--white);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Main Content */
        .main-content {
            padding: 30px;
        }

        .section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-header {
            margin-bottom: 30px;
        }

        .section-header h2 {
            font-size: 2rem;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .section-header h2 i {
            color: var(--primary);
            margin-right: 10px;
        }

        .section-header p {
            color: var(--gray);
            font-size: 1.1rem;
        }

        /* Stats */
        .stats {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: var(--light-gray);
            border-radius: 4px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary));
            transition: width 0.3s ease;
        }

        /* Filters */
        .filters {
            margin-top: 15px;
        }

        #topic-filter {
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid var(--light-gray);
            font-size: 1rem;
            background: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #topic-filter:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Question Container */
        #question-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-card {
            background: var(--white);
            border: 2px solid var(--light-gray);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .question-card.correct {
            border-color: var(--success);
            background: #f0fffa;
        }

        .question-card.wrong {
            border-color: var(--danger);
            background: #fff5f5;
        }

        .question-number {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--dark);
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .question-text pre {
            background: transparent;
            margin: 0;
            white-space: pre-wrap;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            padding: 12px 20px;
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            background: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 1rem;
        }

        .option-btn:hover:not(.disabled) {
            background: #f0f0ff;
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #f0f0ff;
        }

        .option-btn.correct-answer {
            border-color: var(--success);
            background: #d4f5f0;
            color: #00b894;
        }

        .option-btn.wrong-answer {
            border-color: var(--danger);
            background: #ffe0e0;
            color: #e17055;
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Explanation */
        .explanation {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
        }

        .explanation h4 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .explanation p {
            color: var(--dark);
            line-height: 1.6;
        }

        .teaching-note {
            margin-top: 10px;
            padding: 10px;
            background: #e8f4fd;
            border-radius: 8px;
            border-left: 4px solid var(--secondary);
        }

        .nav-arrow {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-arrow:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .nav-arrow:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Projects */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .project-card {
            background: var(--white);
            border: 2px solid var(--light-gray);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-5px);
        }

        .project-card .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .badge.beginner {
            background: #d4f5f0;
            color: #00b894;
        }

        .badge.intermediate {
            background: #fef3e2;
            color: #fdcb6e;
        }

        .badge.advanced {
            background: #ffe0e0;
            color: #e17055;
        }

        .project-card h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .project-card p {
            color: var(--gray);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .project-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .project-card .tag {
            background: var(--light-gray);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            color: var(--gray);
        }

        .project-card details {
            margin-bottom: 15px;
        }

        .project-card summary {
            cursor: pointer;
            color: var(--primary);
            font-weight: 600;
            padding: 8px 0;
        }

        .project-card pre {
            background: var(--dark);
            color: var(--white);
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            margin-top: 10px;
        }

        .project-card pre code {
            color: #00d2d3;
        }

        .project-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            width: 100%;
        }

        .project-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        /* Notes */
        .note-section {
            margin-bottom: 30px;
        }

        .note-section h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .note-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
        }

        .note-card h4 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .note-card p {
            color: var(--gray);
            line-height: 1.8;
        }

        .note-card strong {
            color: var(--dark);
        }

        /* Progress Section */
        .progress-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card .label {
            color: var(--gray);
            margin-top: 5px;
        }

        .topic-progress {
            margin-bottom: 10px;
        }

        .topic-progress .topic-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .topic-progress .progress-track {
            height: 8px;
            background: var(--light-gray);
            border-radius: 4px;
            overflow: hidden;
        }

        .topic-progress .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            nav {
                justify-content: center;
            }

            .nav-btn {
                font-size: 0.8rem;
                padding: 8px 12px;
            }

            .main-content {
                padding: 15px;
            }

            .section-header h2 {
                font-size: 1.5rem;
            }

            .project-grid {
                grid-template-columns: 1fr;
            }

            .question-text {
                font-size: 0.95rem;
                padding: 10px;
            }

            .option-btn {
                font-size: 0.9rem;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-code"></i>
                <h1>JavaScript Mastery</h1>
            </div>
            <nav>
                <button class="nav-btn active" data-section="questions">
                    <i class="fas fa-question-circle"></i> Questions
                </button>
                <button class="nav-btn" data-section="projects">
                    <i class="fas fa-project-diagram"></i> Projects
                </button>
                <button class="nav-btn" data-section="notes">
                    <i class="fas fa-book"></i> Notes
                </button>
                <button class="nav-btn" data-section="progress">
                    <i class="fas fa-chart-line"></i> Progress
                </button>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Questions Section -->
            <section id="questions-section" class="section active">
                <div class="section-header">
                    <h2><i class="fas fa-question-circle"></i> Practice Questions</h2>
                    <div class="stats">
                        <span>Progress: <span id="progress-text">0/300</span></span>
                        <div class="progress-bar">
                            <div id="progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="filters">
                        <select id="topic-filter">
                            <option value="all">All Topics</option>
                            <option value="variables">Variables</option>
                            <option value="conditionals">Conditional Statements</option>
                            <option value="loops">Loops</option>
                            <option value="functions">Functions</option>
                        </select>
                    </div>
                </div>
                <div id="question-container"></div>
            </section>

            <!-- Projects Section -->
            <section id="projects-section" class="section">
                <div class="section-header">
                    <h2><i class="fas fa-project-diagram"></i> 30 JavaScript Projects</h2>
                    <p>Build real-world projects to master JavaScript</p>
                </div>
                <div id="projects-container"></div>
            </section>

            <!-- Notes Section -->
            <section id="notes-section" class="section">
                <div class="section-header">
                    <h2><i class="fas fa-book"></i> Teaching Notes</h2>
                    <p>Detailed explanations for every concept</p>
                </div>
                <div id="notes-container"></div>
            </section>

            <!-- Progress Section -->
            <section id="progress-section" class="section">
                <div class="section-header">
                    <h2><i class="fas fa-chart-line"></i> Your Progress</h2>
                    <p>Track your learning journey</p>
                </div>
                <div id="progress-container"></div>
            </section>
        </main>
    </div>

    <script>
        // ============================================================
        // DATA: Questions (300 questions covering all topics)
        // ============================================================
        const questions = [
            // SECTION 1: VARIABLES (Questions 1-50)
            {
                id: 1,
                topic: 'variables',
                question: 'let x = 5;\nlet x = 10;\nconsole.log(x);',
                options: [
                    'A) 10',
                    'B) 5',
                    'C) Error - Cannot redeclare block-scoped variable',
                    'D) undefined'
                ],
                correct: 2,
                explanation: '❌ let does not allow redeclaration in the same scope. Unlike var, which allows redeclaration. When you try to redeclare a let variable, JavaScript throws a SyntaxError.\n\n📌 Key Concept: let and const are block-scoped and cannot be redeclared in the same scope.',
                teaching_note: '🚀 Teaching Point: This demonstrates the importance of using let and const over var. It prevents accidental redeclaration bugs.'
            },
            {
                id: 2,
                topic: 'variables',
                question: 'var y = 5;\nvar y = 10;\nconsole.log(y);',
                options: [
                    'A) 5',
                    'B) 10',
                    'C) Error',
                    'D) undefined'
                ],
                correct: 1,
                explanation: '✅ var allows redeclaration, so the second declaration overwrites the first. The variable y is first set to 5, then redeclared and set to 10.\n\n📌 Key Concept: var is function-scoped and allows redeclaration.',
                teaching_note: '🚀 Teaching Point: var can be redeclared, which can lead to bugs. Modern JS prefers let and const.'
            },
            {
                id: 3,
                topic: 'variables',
                question: 'const z = 5;\nz = 10;\nconsole.log(z);',
                options: [
                    'A) 10',
                    'B) 5',
                    'C) Error - Assignment to constant variable',
                    'D) undefined'
                ],
                correct: 2,
                explanation: '❌ const variables cannot be reassigned after declaration. Once a const is initialized, its value cannot be changed.\n\n📌 Key Concept: const is for values that should not be reassigned.',
                teaching_note: '🚀 Teaching Point: Use const by default, let when you need to reassign. This prevents accidental reassignment.'
            },
            {
                id: 4,
                topic: 'variables',
                question: 'let a;\nconsole.log(a);',
                options: [
                    'A) null',
                    'B) 0',
                    'C) undefined',
                    'D) Error'
                ],
                correct: 2,
                explanation: '📌 Variables declared with let but not initialized have the value undefined. This is JavaScript\'s default value for unassigned variables.',
                teaching_note: '🚀 Teaching Point: undefined means "no value assigned yet". Different from null which means "intentionally empty".'
            },
            {
                id: 5,
                topic: 'variables',
                question: 'var b;\nconsole.log(b);',
                options: [
                    'A) null',
                    'B) 0',
                    'C) undefined',
                    'D) Error'
                ],
                correct: 2,
                explanation: '📌 Variables declared with var but not initialized have the value undefined, just like let.',
                teaching_note: '🚀 Teaching Point: Both let and var give undefined when uninitialized, but var hoists differently.'
            },
            {
                id: 6,
                topic: 'variables',
                question: 'console.log(c);\nvar c = 5;',
                options: [
                    'A) 5',
                    'B) undefined',
                    'C) ReferenceError',
                    'D) null'
                ],
                correct: 1,
                explanation: '📌 var declarations are hoisted to the top of their scope, but not their assignments. So c exists but is undefined at the time of logging. This is called "hoisting".',
                teaching_note: '🚀 Teaching Point: Hoisting moves declarations to the top. This is why var can be accessed before declaration.'
            },
            {
                id: 7,
                topic: 'variables',
                question: 'console.log(d);\nlet d = 5;',
                options: [
                    'A) 5',
                    'B) undefined',
                    'C) ReferenceError - Cannot access before initialization',
                    'D) null'
                ],
                correct: 2,
                explanation: '❌ let declarations are hoisted but not initialized, creating a "temporal dead zone". You cannot access a let variable before its declaration.',
                teaching_note: '🚀 Teaching Point: Temporal Dead Zone (TDZ) is a period where let/const variables exist but cannot be accessed.'
            },
            {
                id: 8,
                topic: 'variables',
                question: 'const e;\ne = 5;\nconsole.log(e);',
                options: [
                    'A) 5',
                    'B) undefined',
                    'C) Error - Missing initializer in const declaration',
                    'D) null'
                ],
                correct: 2,
                explanation: '❌ const must be initialized at the time of declaration. You cannot declare a const variable without assigning a value.',
                teaching_note: '🚀 Teaching Point: const requires immediate initialization. Always provide a value when declaring const.'
            },
            {
                id: 9,
                topic: 'variables',
                question: 'let f = 5;\nf = "hello";\nconsole.log(f);',
                options: [
                    'A) 5',
                    'B) "hello"',
                    'C) Error',
                    'D) undefined'
                ],
                correct: 1,
                explanation: '📌 JavaScript is dynamically typed, so variables can hold any type. The variable f starts as a number but is reassigned to a string.',
                teaching_note: '🚀 Teaching Point: Dynamic typing gives flexibility but requires careful type checking.'
            },
            {
                id: 10,
                topic: 'variables',
                question: 'var g = 5;\nlet g = 10;\nconsole.log(g);',
                options: [
                    'A) 10',
                    'B) 5',
                    'C) Error - Cannot redeclare block-scoped variable',
                    'D) undefined'
                ],
                correct: 2,
                explanation: '❌ You cannot redeclare a variable in the same scope with different keywords. Even though var allows redeclaration, mixing var and let for the same variable name causes an error.',
                teaching_note: '🚀 Teaching Point: Stick to one declaration style per variable. Don\'t mix var and let/const for the same variable.'
            },
            {
                id: 11,
                topic: 'variables',
                question: 'let x = "5" + 5;\nconsole.log(x);',
                options: [
                    'A) 10',
                    'B) "55"',
                    'C) 55',
                    'D) "10"'
                ],
                correct: 1,
                explanation: '📌 The + operator with a string converts the number to a string and concatenates. When one operand is a string, JavaScript performs string concatenation.',
                teaching_note: '🚀 Teaching Point: The + operator is overloaded - it can add numbers OR concatenate strings. Be careful!'
            },
            {
                id: 12,
                topic: 'variables',
                question: 'let y = "5" - 5;\nconsole.log(y);',
                options: [
                    'A) "55"',
                    'B) 0',
                    'C) "0"',
                    'D) NaN'
                ],
                correct: 1,
                explanation: '📌 The - operator converts the string to a number and performs subtraction. When using subtraction, JavaScript converts strings to numbers.',
                teaching_note: '🚀 Teaching Point: The - operator is ONLY for numbers. It coerces operands to numbers first.'
            },
            {
                id: 13,
                topic: 'variables',
                question: 'let z = 5 + true;\nconsole.log(z);',
                options: [
                    'A) "5true"',
                    'B) 6',
                    'C) true',
                    'D) 5'
                ],
                correct: 1,
                explanation: '📌 true is converted to 1 when used in arithmetic operations. So 5 + 1 = 6.',
                teaching_note: '🚀 Teaching Point: Booleans convert to numbers (true=1, false=0) in arithmetic operations.'
            },
            {
                id: 14,
                topic: 'variables',
                question: 'let a = 5 + false;\nconsole.log(a);',
                options: [
                    'A) "5false"',
                    'B) 5',
                    'C) false',
                    'D) 6'
                ],
                correct: 1,
                explanation: '📌 false is converted to 0 when used in arithmetic operations. So 5 + 0 = 5.',
                teaching_note: '🚀 Teaching Point: false becomes 0 in numeric contexts.'
            },
            {
                id: 15,
                topic: 'variables',
                question: 'let b = "5" + true;\nconsole.log(b);',
                options: [
                    'A) 6',
                    'B) "5true"',
                    'C) "5"',
                    'D) NaN'
                ],
                correct: 1,
                explanation: '📌 String concatenation occurs because one operand is a string. JavaScript converts true to "true" and concatenates with "5".',
                teaching_note: '🚀 Teaching Point: If either operand is a string, + performs concatenation instead of addition.'
            },
            {
                id: 16,
                topic: 'variables',
                question: 'let c = 5 * "2";\nconsole.log(c);',
                options: [
                    'A) "52"',
                    'B) 10',
                    'C) "10"',
                    'D) NaN'
                ],
                correct: 1,
                explanation: '📌 Multiplication converts the string "2" to the number 2. So 5 * 2 = 10.',
                teaching_note: '🚀 Teaching Point: *, /, and - always convert strings to numbers first.'
            },
            {
                id: 17,
                topic: 'variables',
                question: 'let d = "hello" * 2;\nconsole.log(d);',
                options: [
                    'A) "hellohello"',
                    'B) NaN',
                    'C) 0',
                    'D) undefined'
                ],

                code: `class MemoryGame {\n    constructor(deckSize = 12) {\n        this.cards = [];\n        this.flipped = [];\n        this.matched = 0;\n        this.locked = false;\n    }\n    initDeck(emojis) {\n        const doubleEmojis = [...emojis, ...emojis];\n        this.cards = doubleEmojis\n            .sort(() => Math.random() - 0.5)\n            .map((emoji, index) => ({\n                id: index,\n                emoji,\n                flipped: false,\n                matched: false\n            }));\n    }\n    flipCard(index) {\n        if (this.locked) return;\n        if (this.cards[index].flipped || this.cards[index].matched) return;\n        this.cards[index].flipped = true;\n        this.flipped.push(index);\n        if (this.flipped.length === 2) {\n            this.locked = true;\n            this.checkMatch();\n        }\n    }\n    checkMatch() {\n        const [i, j] = this.flipped;\n        if (this.cards[i].emoji === this.cards[j].emoji) {\n            this.cards[i].matched = true;\n            this.cards[j].matched = true;\n            this.matched += 2;\n            this.flipped = [];\n            this.locked = false;\n        } else {\n            setTimeout(() => {\n                this.cards[i].flipped = false;\n                this.cards[j].flipped = false;\n                this.flipped = [];\n                this.locked = false;\n            }, 1000);\n        }\n    }\n}`
            },
            {
                id: 15,
                title: "Quiz Application",
                level: "intermediate",
                description: "Interactive quiz with multiple choice questions. Practice with objects and conditionals.",
                topics: ["Objects", "Arrays", "Conditionals", "Functions"],
                code: `class Quiz {\n    constructor(questions) {\n        this.questions = questions;\n        this.currentQuestion = 0;\n        this.score = 0;\n    }\n    getQuestion() {\n        return this.questions[this.currentQuestion];\n    }\n    answer(selected) {\n        const question = this.getQuestion();\n        if (selected === question.correct) {\n            this.score++;\n            return true;\n        }\n        return false;\n    }\n    nextQuestion() {\n        this.currentQuestion++;\n        return this.currentQuestion < this.questions.length;\n    }\n    getScore() {\n        return \`\${this.score}/\${this.questions.length}\`;\n    }\n}`
            },
            {
                id: 16,
                title: "Color Generator",
                level: "intermediate",
                description: "Generate random colors and color palettes. Practice with functions and DOM manipulation.",
                topics: ["Functions", "DOM", "Math.random", "Loops"],
                code: `function generateRandomColor() {\n    const hex = '0123456789ABCDEF';\n    let color = '#';\n    for (let i = 0; i < 6; i++) {\n        color += hex[Math.floor(Math.random() * 16)];\n    }\n    return color;\n}\nfunction generatePalette(count = 5) {\n    const palette = [];\n    for (let i = 0; i < count; i++) {\n        palette.push(generateRandomColor());\n    }\n    return palette;\n}\nfunction getColorInfo(color) {\n    const r = parseInt(color.slice(1,3), 16);\n    const g = parseInt(color.slice(3,5), 16);\n    const b = parseInt(color.slice(5,7), 16);\n    const brightness = (r * 299 + g * 587 + b * 114) / 1000;\n    return { r, g, b, brightness };\n}`
            },
            {
                id: 17,
                title: "Note Taking App",
                level: "intermediate",
                description: "Create, edit, and delete notes with localStorage. Practice with CRUD operations.",
                topics: ["localStorage", "Functions", "Objects", "Arrays"],
                code: `class NoteApp {\n    constructor() {\n        this.notes = JSON.parse(localStorage.getItem('notes')) || [];\n    }\n    saveNotes() {\n        localStorage.setItem('notes', JSON.stringify(this.notes));\n    }\n    addNote(title, content) {\n        const note = {\n            id: Date.now(),\n            title,\n            content,\n            created: new Date().toISOString(),\n            updated: new Date().toISOString()\n        };\n        this.notes.push(note);\n        this.saveNotes();\n        return note;\n    }\n    deleteNote(id) {\n        this.notes = this.notes.filter(note => note.id !== id);\n        this.saveNotes();\n    }\n    updateNote(id, updates) {\n        const note = this.notes.find(n => n.id === id);\n        if (note) {\n            Object.assign(note, updates, { updated: new Date().toISOString() });\n            this.saveNotes();\n        }\n        return note;\n    }\n    searchNotes(query) {\n        return this.notes.filter(note => \n            note.title.toLowerCase().includes(query.toLowerCase()) ||\n            note.content.toLowerCase().includes(query.toLowerCase())\n        );\n    }\n}`
            },
            {
                id: 18,
                title: "Countdown to Event",
                level: "intermediate",
                description: "Countdown timer for specific events/dates. Practice with Date objects and timers.",
                topics: ["Date", "setInterval", "Functions", "Math"],
                code: `function countdownToEvent(eventDate) {\n    const target = new Date(eventDate);\n    const timer = setInterval(() => {\n        const now = new Date();\n        const diff = target - now;\n        if (diff <= 0) {\n            clearInterval(timer);\n            console.log('Event has arrived!');\n            return;\n        }\n        const days = Math.floor(diff / (1000 * 60 * 60 * 24));\n        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));\n        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));\n        const seconds = Math.floor((diff % (1000 * 60)) / 1000);\n        console.log(\`\${days}d \${hours}h \${minutes}m \${seconds}s\`);\n    }, 1000);\n    return timer;\n}`
            },
            {
                id: 19,
                title: "Image Carousel",
                level: "intermediate",
                description: "Automatic image slideshow with navigation controls. Practice with DOM and intervals.",
                topics: ["DOM", "Events", "setInterval", "Functions"],
                code: `class Carousel {\n    constructor(images, interval = 3000) {\n        this.images = images;\n        this.current = 0;\n        this.interval = interval;\n        this.timer = null;\n    }\n    start() {\n        this.timer = setInterval(() => this.next(), this.interval);\n    }\n    stop() {\n        clearInterval(this.timer);\n        this.timer = null;\n    }\n    next() {\n        this.current = (this.current + 1) % this.images.length;\n        this.display();\n    }\n    previous() {\n        this.current = (this.current - 1 + this.images.length) % this.images.length;\n        this.display();\n    }\n    display() {\n        console.log(\`Showing image \${this.current + 1}: \${this.images[this.current]}\`);\n    }\n}`
            },
            {
                id: 20,
                title: "Form Validator",
                level: "intermediate",
                description: "Real-time form validation with error messages. Practice with regex and events.",
                topics: ["Regex", "Events", "Conditionals", "Functions"],
                code: `class FormValidator {\n    constructor() {\n        this.rules = {\n            email: /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/,\n            phone: /^\\+?[1-9]\\d{1,14}$/,\n            password: /^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d]{8,}$/\n        };\n    }\n    validateEmail(email) {\n        return this.rules.email.test(email);\n    }\n    validatePhone(phone) {\n        return this.rules.phone.test(phone);\n    }\n    validatePassword(password) {\n        return this.rules.password.test(password);\n    }\n    validateForm(data) {\n        const errors = {};\n        if (data.email && !this.validateEmail(data.email)) {\n            errors.email = 'Invalid email address';\n        }\n        if (data.phone && !this.validatePhone(data.phone)) {\n            errors.phone = 'Invalid phone number';\n        }\n        if (data.password && !this.validatePassword(data.password)) {\n            errors.password = 'Password must be at least 8 characters with letters and numbers';\n        }\n        return {\n            isValid: Object.keys(errors).length === 0,\n            errors\n        };\n    }\n}`
            }
        ];

        // ============================================================
        // DATA: Teaching Notes
        // ============================================================
        const teachingNotes = [
            {
                title: '📌 Variables - Complete Guide',
                topics: [
                    {
                        title: 'Declaration Keywords',
                        content: `
                            <strong>var:</strong> Function-scoped, hoisted, can be redeclared<br>
                            <strong>let:</strong> Block-scoped, not hoisted (TDZ), cannot be redeclared<br>
                            <strong>const:</strong> Block-scoped, not hoisted, cannot be reassigned<br>
                            <br>
                            <strong>Best Practice:</strong> Use const by default, let when you need to reassign, avoid var.
                        `
                    },
                    {
                        title: 'Scope Rules',
                        content: `
                            <strong>Global Scope:</strong> Variables declared outside any function<br>
                            <strong>Function Scope:</strong> Variables declared inside a function (var)<br>
                            <strong>Block Scope:</strong> Variables declared inside {} blocks (let, const)<br>
                            <br>
                            <strong>Key Insight:</strong> The difference between var, let, and const is primarily about scope and hoisting.
                        `
                    }
                ]
            },
            {
                title: '🔄 Conditional Statements - Complete Guide',
                topics: [
                    {
                        title: 'if/else Statements',
                        content: `
                            <strong>if:</strong> Executes block if condition is true<br>
                            <strong>else if:</strong> Executes if previous conditions false and this condition true<br>
                            <strong>else:</strong> Executes when all previous conditions are false<br>
                            <br>
                            <strong>Truthy Values:</strong> true, non-zero numbers, non-empty strings, objects, arrays<br>
                            <strong>Falsy Values:</strong> false, 0, "", null, undefined, NaN
                        `
                    },
                    {
                        title: 'switch Statements',
                        content: `
                            <strong>Syntax:</strong> switch(expression) { case value: statements; break; default: statements; }<br>
                            <strong>Key Points:</strong> Uses strict equality (===), break prevents fall-through<br>
                            <strong>Best Practice:</strong> Always include default case for safety
                        `
                    }
                ]
            },
            {
                title: '🔄 Loops - Complete Guide',
                topics: [
                    {
                        title: 'for Loop',
                        content: `
                            <strong>Syntax:</strong> for (initialization; condition; increment) { statements }<br>
                            <strong>Common Use Cases:</strong> Iterating arrays, known iteration counts<br>
                            <strong>Example:</strong> for (let i = 0; i < array.length; i++) { /* code */ }
                        `
                    },
                    {
                        title: 'while and do-while',
                        content: `
                            <strong>while:</strong> Checks condition before each iteration<br>
                            <strong>do-while:</strong> Executes at least once, checks condition after<br>
                            <strong>Use Case:</strong> When number of iterations is unknown
                        `
                    },
                    {
                        title: 'Loop Control Statements',
                        content: `
                            <strong>break:</strong> Exits the loop immediately<br>
                            <strong>continue:</strong> Skips current iteration<br>
                            <strong>Labels:</strong> Allow breaking/continuing nested loops<br>
                            <strong>Best Practice:</strong> Use break/continue sparingly for readability
                        `
                    }
                ]
            },
            {
                title: '📊 Functions - Complete Guide',
                topics: [
                    {
                        title: 'Function Declaration vs Expression',
                        content: `
                            <strong>Function Declaration:</strong> function name() { }<br>
                            <strong>Function Expression:</strong> const name = function() { }<br>
                            <strong>Arrow Function:</strong> const name = () => { }<br>
                            <strong>Key Differences:</strong> Declarations are hoisted, expressions are not
                        `
                    },
                    {
                        title: 'Parameters and Arguments',
                        content: `
                            <strong>Default Parameters:</strong> function name(param = defaultValue)<br>
                            <strong>Rest Parameters:</strong> function name(...rest) { }<br>
                            <strong>Spread Operator:</strong> functionName(...array)<br>
                            <strong>Best Practice:</strong> Use default parameters for optional values
                        `
                    },
                    {
                        title: 'Closures and Scope',
                        content: `
                            <strong>Closure:</strong> Function that retains access to its outer scope<br>
                            <strong>Use Cases:</strong> Private variables, function factories<br>
                            <strong>Example:</strong> function outer() { let x = 1; return function() { return x++; } }
                        `
                    },
                    {
                        title: 'Higher-Order Functions',
                        content: `
                            <strong>Definition:</strong> Functions that take functions as arguments or return functions<br>
                            <strong>Examples:</strong> map, filter, reduce, debounce, throttle<br>
                            <strong>Benefits:</strong> Code reuse, composition, functional programming
                        `
                    }
                ]
            }
        ];

        // ============================================================
        // APP: Main Application Logic
        // ============================================================
        class JavaScriptMasteryApp {
            constructor() {
                this.currentQuestion = 0;
                this.answeredQuestions = new Set();
                this.score = 0;
                this.totalQuestions = questions.length;
                this.filteredQuestions = [...questions];
                this.currentSection = 'questions';
                this.answeredStates = new Map();
                
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.loadQuestions();
                this.loadProjects();
                this.loadNotes();
                this.updateProgress();
                this.renderQuestion(0);
            }
            
            setupEventListeners() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const section = btn.dataset.section;
                        this.switchSection(section);
                    });
                });
                
                document.getElementById('topic-filter').addEventListener('change', (e) => {
                    this.filterQuestions(e.target.value);
                });
            }
            
            switchSection(section) {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.section === section);
                });
                
                document.querySelectorAll('.section').forEach(el => {
                    el.classList.toggle('active', el.id === `${section}-section`);
                });
                
                this.currentSection = section;
                
                if (section === 'questions') {
                    this.loadQuestions();
                } else if (section === 'projects') {
                    this.loadProjects();
                } else if (section === 'notes') {
                    this.loadNotes();
                } else if (section === 'progress') {
                    this.loadProgress();
                }
            }
            
            filterQuestions(topic) {
                if (topic === 'all') {
                    this.filteredQuestions = [...questions];
                } else {
                    this.filteredQuestions = questions.filter(q => q.topic === topic);
                }
                this.currentQuestion = 0;
                this.loadQuestions();
                this.renderQuestion(0);
            }
            
            loadQuestions() {
                const container = document.getElementById('question-container');
                container.innerHTML = '';
                
                if (this.filteredQuestions.length === 0) {
                    container.innerHTML = '<p>No questions found for this topic.</p>';
                    return;
                }
                
                const question = this.filteredQuestions[this.currentQuestion];
                const total = this.filteredQuestions.length;
                
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="question-number">
                        Question ${this.currentQuestion + 1} of ${total}
                    </div>
                    <div class="question-text">
                        <pre>${question.question}</pre>
                    </div>
                    <div class="options">
                        ${question.options.map((opt, idx) => `
                            <button class="option-btn" data-index="${idx}">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div class="explanation" style="display: none;">
                        <h4>📖 Explanation</h4>
                        <p>${question.explanation.replace(/\n/g, '<br>')}</p>
                        ${question.teaching_note ? `
                            <div class="teaching-note">
                                <strong>👨‍🏫 Teaching Note:</strong> ${question.teaching_note}
                            </div>
                        ` : ''}
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                        <button class="nav-arrow" id="prev-btn" ${this.currentQuestion === 0 ? 'disabled' : ''}>
                            <i class="fas fa-arrow-left"></i> Previous
                        </button>
                        <button class="nav-arrow" id="next-btn" ${this.currentQuestion === total - 1 ? 'disabled' : ''}>
                            Next <i class="fas fa-arrow-right"></i>
                        </button>
                        <button class="nav-arrow" id="reset-btn" style="margin-left: auto;">
                            <i class="fas fa-redo"></i> Reset Progress
                        </button>
                    </div>
                `;
                
                container.appendChild(card);
                
                card.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (btn.classList.contains('disabled')) return;
                        this.handleAnswer(parseInt(btn.dataset.index));
                    });
                });
                
                document.getElementById('prev-btn')?.addEventListener('click', () => {
                    if (this.currentQuestion > 0) {
                        this.currentQuestion--;
                        this.loadQuestions();
                    }
                });
                
                document.getElementById('next-btn')?.addEventListener('click', () => {
                    if (this.currentQuestion < total - 1) {
                        this.currentQuestion++;
                        this.loadQuestions();
                    }
                });
                
                document.getElementById('reset-btn')?.addEventListener('click', () => {
                    if (confirm('Reset all progress?')) {
                        this.resetProgress();
                    }
                });
                
                this.updateProgress();
            }
            
            handleAnswer(selectedIndex) {
                const question = this.filteredQuestions[this.currentQuestion];
                const options = document.querySelectorAll('.option-btn');
                const explanation = document.querySelector('.explanation');
                
                options.forEach(btn => btn.classList.add('disabled'));
                
                const isCorrect = selectedIndex === question.correct;
                if (isCorrect) {
                    options[selectedIndex].classList.add('correct-answer');
                    this.score++;
                } else {
                    options[selectedIndex].classList.add('wrong-answer');
                    options[question.correct].classList.add('correct-answer');
                }
                
                explanation.style.display = 'block';
                
                const questionId = question.id;
                this.answeredQuestions.add(questionId);
                this.answeredStates.set(questionId, isCorrect);
                
                this.updateProgress();
                
                setTimeout(() => {
                    if (this.currentQuestion < this.filteredQuestions.length - 1) {
                        this.currentQuestion++;
                        this.loadQuestions();
                    }
                }, 3000);
            }
            
            updateProgress() {
                const total = this.filteredQuestions.length;
                const answered = this.answeredQuestions.size;
                const percentage = total > 0 ? (answered / total * 100) : 0;
                
                document.getElementById('progress-text').textContent = `${answered}/${total}`;
                document.getElementById('progress-fill').style.width = `${percentage}%`;
            }
            
            resetProgress() {
                this.answeredQuestions.clear();
                this.answeredStates.clear();
                this.score = 0;
                this.currentQuestion = 0;
                this.updateProgress();
                this.loadQuestions();
            }
            
            loadProjects() {
                const container = document.getElementById('projects-container');
                container.innerHTML = `
                    <div class="project-grid">
                        ${projects.map(project => `
                            <div class="project-card">
                                <span class="badge ${project.level}">${project.level}</span>
                                <h3><i class="fas fa-project-diagram"></i> ${project.title}</h3>
                                <p>${project.description}</p>
                                <div class="tags">
                                    ${project.topics.map(topic => `
                                        <span class="tag">${topic}</span>
                                    `).join('')}
                                </div>
                                <details>
                                    <summary>📝 View Code</summary>
                                    <pre><code>${project.code}</code></pre>
                                </details>
                                <button class="project-btn" onclick="alert('Open this project in your favorite code editor or online IDE like CodePen, Replit, or JSFiddle to practice!')">
                                    <i class="fas fa-play"></i> Open in Editor
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            loadNotes() {
                const container = document.getElementById('notes-container');
                container.innerHTML = teachingNotes.map(section => `
                    <div class="note-section">
                        <h3>${section.title}</h3>
                        ${section.topics.map(topic => `
                            <div class="note-card">
                                <h4>${topic.title}</h4>
                                <p>${topic.content}</p>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            }
            
            loadProgress() {
                const container = document.getElementById('progress-container');
                const total = this.filteredQuestions.length;
                const answered = this.answeredQuestions.size;
                const correct = Array.from(this.answeredStates.values()).filter(v => v).length;
                const incorrect = answered - correct;
                const percentage = total > 0 ? Math.round((answered / total) * 100) : 0;
                
                // Calculate topic breakdown
                const topics = {};
                const topicNames = {
                    'variables': 'Variables',
                    'conditionals': 'Conditional Statements',
                    'loops': 'Loops',
                    'functions': 'Functions'
                };
                
                this.answeredStates.forEach((isCorrect, id) => {
                    const question = questions.find(q => q.id === id);
                    if (question) {
                        if (!topics[question.topic]) {
                            topics[question.topic] = { total: 0, correct: 0 };
                        }
                        topics[question.topic].total++;
                        if (isCorrect) topics[question.topic].correct++;
                    }
                });
                
                const topicHTML = Object.entries(topics).map(([topic, stats]) => `
                    <div class="topic-progress">
                        <div class="topic-label">
                            <span>${topicNames[topic] || topic}</span>
                            <span>${stats.correct}/${stats.total}</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${stats.total > 0 ? (stats.correct / stats.total * 100) : 0}%"></div>
                        </div>
                    </div>
                `).join('');
                
                container.innerHTML = `
                    <div class="progress-stats">
                        <div class="stat-card">
                            <div class="number">${answered}</div>
                            <div class="label">Questions Attempted</div>
                        </div>
                        <div class="stat-card">
                            <div class="number" style="color: var(--success);">${correct}</div>
                            <div class="label">Correct Answers</div>
                        </div>
                        <div class="stat-card">
                            <div class="number" style="color: var(--danger);">${incorrect}</div>
                            <div class="label">Incorrect Answers</div>
                        </div>
                        <div class="stat-card">
                            <div class="number" style="color: var(--warning);">${percentage}%</div>
                            <div class="label">Completion Rate</div>
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <h3 style="margin-bottom: 15px;">Topic Breakdown</h3>
                        ${topicHTML || '<p>No questions answered yet. Start practicing!</p>'}
                    </div>
                    ${answered > 0 ? `
                        <div style="margin-top: 20px; text-align: center;">
                            <button class="nav-arrow" onclick="if(confirm('Reset all progress?')) app.resetProgress();" style="margin: 0 auto;">
                                <i class="fas fa-redo"></i> Reset All Progress
                            </button>
                        </div>
                    ` : ''}
                `;
            }
        }

        // Initialize the app when DOM is ready
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new JavaScriptMasteryApp();
        });
    </script>
</body>
